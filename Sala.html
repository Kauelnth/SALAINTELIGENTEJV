
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala Inteligente | Programação</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  color: #f2f4f8;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(55,65,81,.22), transparent 55%),
    linear-gradient(135deg, #07090d 0%, #0b0e14 48%, #080a0f 100%);
  background-attachment: fixed;
}

header {
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2.5px;
}

.logo span,
#data {
  color: #45b8ff;
}

.data-hora {
  text-align: right;
  padding: 10px 16px;
  background: rgba(17,19,26,.82);
  border: 1px solid #244761;
  border-radius: 12px;
}

#relogio {
  font-size: 20px;
  font-weight: bold;
}

#data {
  font-size: 11px;
  margin-top: 4px;
}

.intro {
  text-align: center;
  padding: 55px 15px 75px;
}

.intro small {
  color: #70caff;
  letter-spacing: 3px;
  font-size: 10px;
  font-weight: 700;
}

.intro h1 {
  font-size: clamp(30px, 5vw, 48px);
  margin: 15px 0;
}

main {
  max-width: 900px;
  margin: -30px auto 0;
  padding: 20px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #a1a1aa;
  font-size: 11px;
}

/* PROGRAMAÇÃO */

.programacao {
  max-width: 720px;
  margin: 0 auto 28px;
  padding: 22px;
  background: linear-gradient(
    145deg,
    rgba(12,35,56,.97),
    rgba(7,19,32,.97)
  );
  border: 1px solid rgba(69,184,255,.30);
  border-radius: 15px;
  box-shadow: 0 14px 36px rgba(0,0,0,.25);
}

.programacao h2 {
  text-align: center;
  color: #8bd5ff;
  font-size: 13px;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.lista-horarios {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.item-horario {
  display: grid;
  grid-template-columns: 112px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(69,184,255,.13);
  border-radius: 10px;
}

/* HORÁRIOS EM NEON AZUL */

.item-horario .hora {
  color: #8bd8ff;
  font-weight: 900;
  font-size: 17px;
  white-space: nowrap;
  text-shadow:
    0 0 5px #149fff,
    0 0 10px #149fff,
    0 0 18px #087dff,
    0 0 28px rgba(0,145,255,.85);
  animation: neonAzul 1.8s ease-in-out infinite alternate;
}

@keyframes neonAzul {
  from {
    text-shadow:
      0 0 4px #149fff,
      0 0 8px #149fff,
      0 0 14px #087dff,
      0 0 22px rgba(0,145,255,.65);
  }

  to {
    text-shadow:
      0 0 7px #7bd5ff,
      0 0 14px #149fff,
      0 0 24px #087dff,
      0 0 36px rgba(0,145,255,1);
  }
}

.item-horario strong {
  font-size: 12px;
}

.item-horario small {
  display: block;
  color: #9fb5c8;
  font-size: 10px;
  margin-top: 4px;
}

.item-horario .duracao {
  color: #b9d9ed;
  font-size: 10px;
  white-space: nowrap;
}

/* INTERVALOS */

.item-horario.intervalo {
  background: rgba(30,105,155,.15);
  border-style: dashed;
}

.item-horario.intervalo .hora {
  color: #a8dcff;
}

/* DESTAQUE DA SESSÃO ATUAL */

.item-horario.agora {
  border-color: #45b8ff;
  background: rgba(31,139,205,.22);
  box-shadow: 0 0 0 1px rgba(69,184,255,.15);
}

.item-horario.concluido {
  opacity: .58;
}

/* LEGENDA */

.legenda {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 14px;
  color: #9fb5c8;
  font-size: 10px;
}

.legenda span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.ponto {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.ponto.atual {
  background: #45b8ff;
}

.ponto.intervalo {
  background: #a8dcff;
}

.ponto.finalizado {
  background: #60798c;
}

/* RESPONSIVIDADE */

@media(max-width:550px) {
  .item-horario {
    grid-template-columns: 1fr auto;
    gap: 5px 10px;
  }

  .item-horario .hora {
    grid-column: 1;
  }

  .item-horario>div:nth-child(2) {
    grid-column: 1;
  }

  .item-horario .duracao {
    grid-column: 2;
    grid-row: 1/span 2;
  }

  header {
    justify-content: center;
    text-align: center;
  }

  .data-hora {
    text-align: center;
  }

  .intro {
    padding: 40px 15px 65px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SALA <span>INTELIGENTE</span></div>

  <div class="data-hora">
    <div id="relogio">00:00:00</div>
    <div id="data">Carregando data...</div>
  </div>
</header>

<section class="intro">
  <small>PROJETO • TECNOLOGIA • AUTOMAÇÃO</small>
  <h1>Sala Inteligente</h1>
</section>

<main>

  <section class="programacao">
    <h2>🕘 HORÁRIOS DAS APRESENTAÇÕES</h2>

    <div class="lista-horarios" id="listaHorarios"></div>

    <div class="legenda">
      <span>
        <i class="ponto atual"></i>
        Em andamento
      </span>

      <span>
        <i class="ponto intervalo"></i>
        Intervalo
      </span>

      <span>
        <i class="ponto finalizado"></i>
        Encerrado
      </span>
    </div>
  </section>

</main>

<footer>
  SALA DE ESTAR INTELIGENTE • PROJETO JV
</footer>

<script>

// RELÓGIO E DATA

function atualizarRelogio() {
  const agora = new Date();

  document.getElementById("relogio").textContent =
    agora.toLocaleTimeString("pt-BR");

  document.getElementById("data").textContent =
    agora.toLocaleDateString("pt-BR", {
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    });
}

atualizarRelogio();
setInterval(atualizarRelogio, 1000);


// PROGRAMAÇÃO DAS SESSÕES

function minutoParaHora(total) {
  const h = Math.floor(total / 60);
  const m = total % 60;

  return String(h).padStart(2, '0') + ':' +
         String(m).padStart(2, '0');
}


function montarProgramacao() {

  const lista = document.getElementById('listaHorarios');

  if (!lista) return;

  let minuto = 9 * 60 + 10;
  let conteudo = '';

  for (let i = 1; i <= 6; i++) {

    const inicio = minuto;
    const fim = inicio + 25;

    conteudo += `
      <div class="item-horario"
           data-inicio="${inicio}"
           data-fim="${fim}"
           data-tipo="sessao">

        <div class="hora">
          ${minutoParaHora(inicio)} – ${minutoParaHora(fim)}
        </div>

        <div>
          <strong>Sessão ${i}</strong>
          <small>Sala Inteligente</small>
        </div>

        <div class="duracao">25 min</div>

      </div>
    `;

    minuto = fim;


    // INTERVALOS DE 20 MINUTOS
    // Após a terceira e a sexta sessão

    if (i === 3 || i === 6) {

      const fimIntervalo = minuto + 20;

      conteudo += `
        <div class="item-horario intervalo"
             data-inicio="${minuto}"
             data-fim="${fimIntervalo}"
             data-tipo="intervalo">

          <div class="hora">
            ${minutoParaHora(minuto)} – ${minutoParaHora(fimIntervalo)}
          </div>

          <div>
            <strong>Intervalo</strong>
            <small>Pausa de 20 minutos</small>
          </div>

          <div class="duracao">20 min</div>

        </div>
      `;

      minuto = fimIntervalo;
    }
  }

  lista.innerHTML = conteudo;

  atualizarDestaqueProgramacao();
}


// DESTAQUE AUTOMÁTICO DO HORÁRIO ATUAL

function atualizarDestaqueProgramacao() {

  const agora = new Date();

  const atualMin =
    agora.getHours() * 60 + agora.getMinutes();

  const itens =
    document.querySelectorAll('.item-horario');

  itens.forEach(item => {

    const ini = Number(item.dataset.inicio);
    const fim = Number(item.dataset.fim);

    item.classList.remove('agora', 'concluido');

    if (atualMin >= ini && atualMin < fim) {

      item.classList.add('agora');

    } else if (atualMin >= fim) {

      item.classList.add('concluido');

    }

  });

}


// INICIALIZAÇÃO

montarProgramacao();

setInterval(atualizarDestaqueProgramacao, 30000);

</script>

</body>
</html>
